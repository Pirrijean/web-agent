[project]
name = "web-agent"
version = "0.1.0"
description = "Agente generalista de automatización web con políticas de seguridad verificables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_agent"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "websockets>=13",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "browser: pruebas que lanzan Chromium real (sin red externa: todo el tráfico se sirve con un transporte simulado)",
]
