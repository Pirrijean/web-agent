name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Dependencias
        run: uv sync --frozen
      - name: Chromium para Playwright
        run: uv run playwright install --with-deps chromium
      - name: Linter
        run: uvx ruff check src tests --select E9,F,B --ignore B008,B904,E402
      - name: Pruebas
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: web-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name wa -p 8000:8000 --cap-drop=ALL --security-opt no-new-privileges \
            -e EVALUATION_BEARER_TOKEN=ci-token -e WEB_AGENT_MODEL_PROVIDER=scripted web-agent:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          curl -fs -H "Authorization: Bearer ci-token" http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "401"
          ! curl -s http://127.0.0.1:8000/ | grep -q ci-token
          docker rm -f wa
